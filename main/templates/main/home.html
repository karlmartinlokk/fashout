{% extends "main.html" %}

{% block content %}

    <div class="main_wrapper">

        {% if following_posts %}
            <div class="following_feed">
                <div style="display: flex; align-items: center">
                <h1> What's new? </h1> <h2> From your following: </h2>
                </div>
                <div class="following_posts">
                    {% for post in following_posts %}
                        <div class="follower_post">
                            <div class="follower_post_img">
                                <a href="{% url "post_view" pk=post.pk %}">
                                    <img src="{{ post.image.url }}">
                                </a>
                            </div>
                            <div class="follower_post_profile">
                                <img src="{{ post.author.profile.profile_image.url }}">
                            </div>
                        </div>
                        
                    {% endfor %}
                </div>
            </div>
        {% endif %}

        

</div>

{% endblock %}
